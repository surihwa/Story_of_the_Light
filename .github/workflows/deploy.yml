name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 노션 내용만 바꿨을 때 수동으로 다시 빌드하려면 이 버튼을 씁니다.
  workflow_dispatch:
  # 매일 새벽 4시(KST)에 노션 내용을 다시 긁어 옵니다. 필요 없으면 지우세요.
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build with Notion content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PROFILE_DB: ${{ secrets.NOTION_PROFILE_DB }}
          NOTION_STORY_DB: ${{ secrets.NOTION_STORY_DB }}
          NOTION_LOGS_DB: ${{ secrets.NOTION_LOGS_DB }}
          NOTION_SCREENSHOTS_DB: ${{ secrets.NOTION_SCREENSHOTS_DB }}
          NOTION_GALLERY_DB: ${{ secrets.NOTION_GALLERY_DB }}
          NOTION_TIMELINE_DB: ${{ secrets.NOTION_TIMELINE_DB }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
